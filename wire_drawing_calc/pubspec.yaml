name: wire_drawing_calc
description: "A new Flutter project."
publish_to: 'none'

version: 3.0.0+11

environment:
  sdk: '>=3.7.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/iconn.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/background.jpg
    - assets/fonts/Inter-ExtraBold.otf  # Добавляем шрифт в assets
  
  fonts:  # Только ОДИН раздел fonts
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-ExtraBold.otf
          weight: 800